<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEIP Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1a1f3a, #0a0e1a 60%);
        color: #fff;
      }
      .card {
        width: min(92vw, 420px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.06);
        padding: 24px;
        text-align: center;
      }
      img {
        width: 84px;
        height: 84px;
        object-fit: contain;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: 1.1rem;
      }
      p {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.45;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(120deg, #00fff9, #ff006e);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/TEIP.png" alt="TEIP" />
      <h1>Você está offline</h1>
      <p>Sem internet no momento. Reconecte para assistir aos canais ao vivo.</p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>

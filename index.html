<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090B16" />
    
    <title>TeIP - Unindo TVs | Canais de TV ao Vivo & Streaming</title>
    <meta name="description" content="TeIP - Plataforma de canais de TV ao vivo, entretenimento e emissão digital em Angola e no mundo." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="https://teiptv.netlify.app/TEIP.png" />
    <link rel="apple-touch-icon" href="https://teiptv.netlify.app/TEIP.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Syne:wght@400..800&display=swap" rel="stylesheet">

    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }

      * {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: #0d0d0d;
        color: white;
        overflow-x: hidden;
      }

      .scrollbar-none::-webkit-scrollbar { display: none; }
      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
    
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Em desenvolvimento (localhost) não registar o SW para não interferir com o Vite.
      const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && !isLocalDev) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: '/' })
            .then(() => console.log('SW: Ativo'))
            .catch((err) => console.debug('SW: modo offline limitado', err));
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    
    <title>Angoflix - Streaming e TV ao Vivo em Angola</title>
    <meta name="description" content="Angoflix é a plataforma de streaming e canais de TV ao vivo em Angola e países de língua portuguesa." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="https://picsum.photos/id/10/192/192" />
    <link rel="apple-touch-icon" href="https://picsum.photos/id/10/192/192" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Syne:wght@400..800&display=swap" rel="stylesheet">

    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }

      * {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: #0d0d0d;
        color: white;
        overflow-x: hidden;
      }

      .scrollbar-none::-webkit-scrollbar { display: none; }
      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
    
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Registro direto no escopo raiz
          navigator.serviceWorker.register('sw.js', { scope: '/' })
            .then(reg => {
              console.log('SW: Ativo');
            })
            .catch(err => {
              // Silencioso para o usuário, apenas log de debug
              console.debug('SW: Offline mode limited', err);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

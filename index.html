<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    
    <!-- PWA Primary Tags -->
    <title>Tv Kitandeira - Smart PWA</title>
    <meta name="description" content="Assista TV aberta e pública em qualquer lugar com interface de Smart TV." />
    <link rel="manifest" href="manifest.json" />
    
    <!-- Apple Mobile Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tv Kitandeira" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/716/716429.png" />
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f0f0f; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
      
      body {
        background-color: #0f0f0f;
        color: white;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      /* Native feeling for PWA */
      .pt-safe { padding-top: var(--safe-top); }
      .pb-safe { padding-bottom: var(--safe-bottom); }
      
      @media all and (display-mode: standalone) {
        body {
          /* Add extra padding for standalone mode if needed */
        }
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker Ativo'))
            .catch(err => console.error('Erro ao registrar SW:', err));
        });
      }

      // Prevent accidental pull-to-refresh on some mobile browsers
      document.body.addEventListener('touchmove', function(e) {
        if (e.target.closest('.overflow-y-auto')) return;
        if (e.touches.length > 1) return;
        // Optional: e.preventDefault();
      }, {passive: false});
    </script>
  </body>
</html>
